name: Build APK

# Chạy tự động mỗi khi có code mới được đẩy lên nhánh main,
# hoặc bấm "Run workflow" thủ công trong tab Actions.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code về máy build
        uses: actions/checkout@v4

      - name: Cài Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Chuẩn bị Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build file APK (bản thử nghiệm)
        run: gradle assembleDebug

      - name: Đăng file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: alo-xe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
